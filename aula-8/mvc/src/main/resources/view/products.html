<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: topo('Produtos')}"></head>
<body>
<header th:replace="~{index :: cabecalho('Produtos')}"></header>
<main>
<div th:replace="~{index :: mensagens}"></div>
<section>
<small>ADMINISTRADOR</small>
<h2>Cadastrar produto</h2>
<form th:action="@{/produtos}" method="post">
<label>Nome<input name="nome" maxlength="120" required>
</label>
<label>Preço (R$)<input name="preco" type="number" min="0.01" max="999999.99" step="0.01" required>
</label>
<button>Cadastrar</button>
</form>
</section>
<section>
<h2>Produtos cadastrados</h2>
<div class="scroll">
<table>
<thead>
<tr>
<th>Produto</th>
<th>Preço</th>
<th>Saldo</th>
<th>Status</th>
<th>Ação</th>
</tr>
</thead>
<tbody>
<tr th:each="p : ${produtos}">
<td th:text="${p.nome}">
</td>
<td th:text="|R$ ${#numbers.formatDecimal(p.preco,1,'POINT',2,'COMMA')}|">
</td>
<td th:text="${p.estoque}">
</td>
<td th:text="${p.status.descricao}"></td>
<td>
<form th:if="${administrador and p.ativo}" th:action="@{/produtos/{id}/descontinuar(id=${p.id})}" method="post">
<button class="secondary">Descontinuar</button>
</form>
</td>
</tr>
<tr th:if="${#lists.isEmpty(produtos)}">
<td colspan="5">Cadastre o primeiro produto para começar.</td>
</tr>
</tbody>
</table>
</div>
</section>
</main>
<footer>Vendas e estoque</footer>
</body>
</html>
