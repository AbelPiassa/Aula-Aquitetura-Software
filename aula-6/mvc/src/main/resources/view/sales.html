<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index :: topo('Pedidos')}"></head>
<body>
<header th:replace="~{index :: cabecalho('Pedidos')}"></header>
<main>
<div th:replace="~{index :: mensagens}"></div>
<section>
<small>VENDEDOR</small>
<h2>Registrar pedido</h2>
<form th:action="@{/pedidos}" method="post">
<label>Cliente<input name="cliente" maxlength="120" required>
</label>
<label>Produto<select name="produtoId" required>
<option value="">Selecione</option>
<option th:each="p : ${produtos}" th:value="${p.id}" th:text="${p.nome}">
</option>
</select>
</label>
<label>Quantidade<input name="quantidade" type="number" min="1" max="1000000" required>
</label>
<button>Confirmar pedido</button>
<p>A confirmação já dá baixa no estoque.</p>
</form>
</section>
<section>
<h2>Pedidos</h2>
<div class="scroll">
<table>
<thead>
<tr>
<th>Nº</th>
<th>Cliente</th>
<th>Produto</th>
<th>Quantidade</th>
<th>Total</th>
</tr>
</thead>
<tbody>
<tr th:each="p : ${pedidos}">
<td th:text="${p.id}">
</td>
<td th:text="${p.cliente}">
</td>
<td th:text="${p.produto.nome}">
</td>
<td th:text="${p.quantidade}">
</td>
<td th:text="|R$ ${#numbers.formatDecimal(p.total,1,'POINT',2,'COMMA')}|">
</td>
</tr>
<tr th:if="${#lists.isEmpty(pedidos)}">
<td colspan="5">Nenhum pedido registrado.</td>
</tr>
</tbody>
</table>
</div>
</section>
</main>
<footer>Vendas e estoque</footer>
</body>
</html>
