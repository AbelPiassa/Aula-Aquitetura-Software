name: Verificar projetos Java

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  maven:
    name: ${{ matrix.projeto }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projeto: [Aula5/mvc, aula-6/mvc, aula-7/hexagonal, aula-8/mvc]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Compilar e testar
        working-directory: ${{ matrix.projeto }}
        run: bash mvnw -B verify
      - name: Verificar regras do faturamento
        if: matrix.projeto == 'aula-7/hexagonal'
        working-directory: aula-7/hexagonal
        run: bash verificar.sh
